<style>

.logo-dark{display:none}

.filecard{display:flex;align-items:center;gap:10px;width:230px;max-width:100%;padding:10px;border:0;border-radius:14px;background:rgba(128,128,128,.22);color:inherit;text-align:left}
.iconbtn:hover,.act:hover,.pill:hover{background:var(--tint)}
.btn:not(:disabled):hover,.send:not(:disabled):hover,.fab:hover{filter:brightness(1.12)}
.tab:hover{background:var(--sky)}
.fabopt:hover{filter:brightness(.94)}
.row:active,.btn:active,.act:active,.iconbtn:active,.tab:active,.fab:active,.fabopt:active,.attopt:active,.sb:active{transform:scale(.97)}
.shell .send.attach{background:var(--tint);color:var(--ink)}
.attmenu{position:absolute;left:12px;bottom:76px;z-index:7;display:flex;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:22px;background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.3)}

.wpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.wp[aria-pressed=true],.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.msgs[data-bub] .bub.me,.shell[data-skin=dark] .msgs[data-bub] .bub.me{color:#fff}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}

.shell .avatar.src-news{background:#1f5fd0;color:#fff}
.shell .avatar.src-sports{background:#0f9d58;color:#fff}

.tag{margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--tint);color:var(--accent);font-size:11px;font-weight:700}
.tk{display:inline-flex}.tk.read{color:#8ff0ff}.shell[data-skin=dark] .tk.read{color:#0369a1}.msgs[data-bub] .tk.read{color:#8ff0ff}.sub.onl{color:#16a34a;font-weight:600}

</style>

<script>
if(!window.React||!window.ReactDOM){

}else{
const {useState,useEffect,useRef,useCallback,useMemo,Fragment,createElement:h}=React;

/* ---------- config & helpers ---------- */
const API="https://kite-backend-pqsm.onrender.com";
const TOKEN_KEY="kite_token", OTP_MS=10*60*1000, RESEND_MS=30*1000, KEEP_MSGS=500;

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},

const digits=s=>(s||"").replace(/\D/g,"");
const validNum=n=>n.length>=8&&n.length<=15;
const pretty=n=>"+"+n;
const uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2,8);
const hue=s=>{let n=7;for(const c of String(s))n=(n*31+c.charCodeAt(0))>>>0;return 198+n%52};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const clock=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayName=t=>sameDay(t,Date.now())?"Today":sameDay(t,Date.now()-864e5)?"Yesterday":new Date(t).toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"});
const shortWhen=t=>sameDay(t,Date.now())?clock(t):Date.now()-t<6*864e5?new Date(t).toLocaleDateString([],{weekday:"short"}):new Date(t).toLocaleDateString([],{day:"numeric",month:"short"});
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1e3);return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":new Date(t).toLocaleDateString([],{day:"numeric",month:"short"})};

/* Every backend call goes through here. Errors carry .status (0 = network/timeout). */
async function api(path,{method="GET",body,auth=true}={}){
  const headers={"Content-Type":"application/json"};
  const token=store.get(TOKEN_KEY);
  if(auth&&token)headers.Authorization="Bearer "+token;
  let res;
  try{
    res=await fetch(API+path,{method,headers,body:body&&JSON.stringify(body),
      signal:window.AbortSignal&&AbortSignal.timeout?AbortSignal.timeout(25000):undefined});
  }catch(e){
    const err=new Error("Can't reach the server. Check your connection and try again.");
    err.status=0;throw err;
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const err=new Error(data.error||"Something went wrong. Try again.");err.status=res.status;throw err}
  return data;
}

const CLOUD="fic8wg7w",PRESET="kite_uploads",MAX_PIC=5*1024*1024;
async function uploadImage(file,max){
  if(!file||!/^image\//.test(file.type))throw new Error("Choose an image file.");
  file=await shrinkImage(file,max||1280,.82);
  if(file.size>MAX_PIC)throw new Error("Photo must be under 5 MB.");
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",PRESET);
  let res;
  try{res=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd})}
  catch(e){throw new Error("Couldn't upload the photo. Check your connection.")}
  const d=await res.json().catch(()=>({}));
  if(!res.ok||!d.secure_url)throw new Error("Photo upload failed: "+((d.error&&d.error.message)||("error "+res.status)));
  return d.secure_url;
}

async function shrinkImage(file,max,q){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    if(!blob||blob.size>=file.size)return file;
    return new File([blob],(file.name||"photo").replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"});
  }catch(e){return file}
}
const cl=(u,t)=>typeof u==="string"&&u.startsWith("https://res.cloudinary.com/")?u.replace("/upload/","/upload/"+t+"/"):u;
function Img({src,w,t,...r}){
  const [bad,setBad]=useState(false);
  return h("img",{...r,src:bad?src:cl(src,t||("f_auto,q_auto"+(w?",w_"+w:""))),onError:()=>setBad(true)});
}
const fmtSize=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":(b/1048576).toFixed(1)+" MB";
async function uploadAttachment(file){
  const kind=/^image\//.test(file.type)?"image":/^video\//.test(file.type)?"video":/^audio\//.test(file.type)?"audio":"file";
  if(kind==="image")file=await shrinkImage(file,1600,.85);
  const limit=kind==="video"||kind==="audio"?50*1024*1024:10*1024*1024;
  if(file.size>limit)throw new Error("File too large. The limit is "+(limit>>20)+" MB for this type.");
  const rt=kind==="image"?"image":kind==="file"?"raw":"video";
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",PRESET);
  if(rt==="raw")fd.append("public_id","kite/"+uid()+"-"+file.name.replace(/[^\w.\-]+/g,"_"));
  let res;
  try{res=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/"+rt+"/upload",{method:"POST",body:fd})}
  catch(e){throw new Error("Couldn't upload the file. Check your connection.")}
  const d=await res.json().catch(()=>({}));
  if(!res.ok||!d.secure_url)throw new Error("Upload failed: "+((d.error&&d.error.message)||("error "+res.status)));
  return {url:d.secure_url,kind,name:file.name.slice(0,120),size:file.size};
}
async function saveFile(f){
  try{const r=await fetch(f.url);const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  catch(e){window.open(f.url,"_blank","noopener")}

/* ---------- Me ---------- */
function Me({me,prefs,setPrefs,onSave,onSignOut,onAvatar,notify}){

    h("div",{className:"wpgrid"},
      h("button",{className:"wp","aria-pressed":prefs.wall==="none","aria-label":"No wallpaper",onClick:()=>setPrefs(p=>({...p,wall:"none"}))},h("span",{className:"sub"},"None")),
      WALLS.map(([id,name])=>h("button",{key:id,className:"wp","aria-pressed":prefs.wall===id,"aria-label":name,title:name,onClick:()=>setPrefs(p=>({...p,wall:id})),style:{backgroundImage:wallSvg(id),backgroundSize:"120px 120px"}})),
      h("label",{className:"wp","aria-pressed":prefs.wall==="custom",style:{cursor:"pointer"}},h("span",{className:"sub"},"My photo"),h("input",{type:"file",accept:"image/*",style:{display:"none"},onChange:async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const u=await uploadImage(f);setPrefs(q=>({...q,wall:"custom",wallUrl:u}))}catch(x){notify(x.message)}}}))),
    h("h2",{className:"h2"},"Chat bubbles"),

/* ---------- App ---------- */
function App(){
  const [booting,setBooting]=useState(true),[me,setMe]=useState(null);
  const [prefs,setPrefs]=useState(()=>({theme:document.documentElement.dataset.theme||"light",saver:true,wall:"mix",bubble:"blue",...store.json("kite:prefs",{})}));
  const [tab,setTab]=useState("chats"),[partner,setPartner]=useState(null);
  const [msgs,setMsgs]=useState([]),[outbox,setOutbox]=useState([]),[reads,setReads]=useState({}),[names,setNames]=useState({});
  const [online,setOnline]=useState(navigator.onLine!==false),[toast,setToast]=useState(""),[polls,setPolls]=useState(0);
  const cursor=useRef(""),sending=useRef(false),toastTimer=useRef(0),asked=useRef(new Set());
  const [rcpts,setRcpts]=useState({}),[pres,setPres]=useState(null),rcRef=useRef("0");
  const number=me&&me.number;
  const [card,setCard]=useState(null),[fwd,setFwd]=useState(null);
  const openProfile=(n,name,avatar)=>setCard({number:n,name,avatar:avatar||avatarOf(n)});

  const notify=useCallback(t=>{setToast(t);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToast(""),2600)},[]);

  /* theme + prefs */
  useEffect(()=>{
    document.querySelector("meta[name=theme-color]").content=number&&prefs.theme==="dark"?"#000000":"#1668e3";
    store.set("kite:theme",prefs.theme);store.set("kite:prefs",JSON.stringify(prefs));
  },[prefs]);

  /* session */
  const startSession=useCallback(profile=>{
    const n=profile.number;
    store.set("kite:profile",JSON.stringify(profile));
    cursor.current=store.get("kite:cursor:"+n)||"";rcRef.current=store.get("kite:rcc:"+n)||"0";setRcpts(store.json("kite:rc:"+n,{}));
    asked.current=new Set([n]);
    setMsgs(store.json("kite:msgs:"+n,[]));setOutbox(store.json("kite:out:"+n,[]));
    setReads(store.json("kite:reads:"+n,{}));setNames({[n]:{name:profile.name,about:profile.about}});
    setTab("chats");setPartner(null);setMe(profile);
  },[]);
  const signOut=useCallback(()=>{store.del(TOKEN_KEY);store.del("kite:profile");setMe(null);setMsgs([]);setOutbox([]);setPartner(null);setRcpts({});setPres(null)},[]);
  const onAuthed=({token,profile})=>{store.set(TOKEN_KEY,token);startSession(profile)};

  useEffect(()=>{
    (async()=>{
      const token=store.get(TOKEN_KEY);
      if(token){
        try{const r=await api("/api/me");startSession(r.profile)}
        catch(e){
          if(e.status===401)store.del(TOKEN_KEY);           /* only a rejected token logs out */
          else{const cached=store.json("kite:profile",null);if(cached)startSession(cached)}  /* slow/offline server keeps you in */
        }
      }
      setBooting(false);
    })();
  },[startSession]);

  /* persist per-user data */
  useEffect(()=>{if(number)store.set("kite:msgs:"+number,JSON.stringify(msgs.filter(m=>!m.pending).slice(-KEEP_MSGS)))},[msgs,number]);
  useEffect(()=>{if(number)store.set("kite:out:"+number,JSON.stringify(outbox))},[outbox,number]);
  useEffect(()=>{if(number)store.set("kite:reads:"+number,JSON.stringify(reads))},[reads,number]);
  useEffect(()=>{if(number)store.set("kite:rc:"+number,JSON.stringify(rcpts))},[rcpts,number]);

  /* connectivity */
  useEffect(()=>{
    const on=()=>setOnline(true),off=()=>setOnline(false);
    addEventListener("online",on);addEventListener("offline",off);
    return()=>{removeEventListener("online",on);removeEventListener("offline",off)};
  },[]);

  /* presence: heartbeat while the app is open, and look up the open chat partner */
  useEffect(()=>{if(!number)return;const beat=()=>{if(!document.hidden&&navigator.onLine!==false)api("/api/users/presence",{method:"POST"}).catch(()=>{})};beat();const t=setInterval(beat,25000);document.addEventListener("visibilitychange",beat);return()=>{clearInterval(t);document.removeEventListener("visibilitychange",beat)}},[number]);
  useEffect(()=>{setPres(null);if(!number||!partner)return;let on=true;const look=async()=>{if(document.hidden||navigator.onLine===false)return;try{const r=await api("/api/users/presence/"+encodeURIComponent(partner));if(on)setPres(r.hidden?null:r)}catch(e){}};look();const t=setInterval(look,15000);return()=>{on=false;clearInterval(t)}},[number,partner]);
  useEffect(()=>{if(!partner)return;const f=()=>{if(!document.hidden)api("/api/messages/read",{method:"POST",body:{with:partner}}).catch(()=>{})};document.addEventListener("visibilitychange",f);return()=>document.removeEventListener("visibilitychange",f)},[partner]);

  /* receive: poll for messages newer than the cursor, with backoff on failure */
  useEffect(()=>{
    if(!number)return;
    let stop=false,timer=0,fails=0;
    const pull=async()=>{
      const r=await api("/api/messages?after="+encodeURIComponent(cursor.current)+"&rc="+rcRef.current);
      const fresh=(r.messages||[]).filter(m=>m&&m.id&&m.from&&m.to&&typeof m.text==="string");
      if(r.cursor){cursor.current=r.cursor;store.set("kite:cursor:"+number,r.cursor)}
      if(r.receipts&&r.receipts.length)setRcpts(o=>{const n={...o};r.receipts.forEach(x=>{const p=n[x.id]||{};n[x.id]={d:p.d||x.d,r:p.r||x.r}});return n});
      if(r.rc){rcRef.current=String(r.rc);store.set("kite:rcc:"+number,String(r.rc))}
      if(fresh.length)setMsgs(old=>{const map=new Map(old.map(m=>[m.id,m]));fresh.forEach(m=>map.set(m.id,m));return[...map.values()].sort((a,b)=>a.ts-b.ts)});
    };
    const run=async()=>{
      if(stop)return;
      if(!document.hidden&&navigator.onLine!==false){
        try{await pull();fails=0;setPolls(n=>n+1)}
        catch(e){if(e.status===401)return signOut();fails++}
      }
      timer=setTimeout(run,Math.min(60000,(prefs.saver?20000:6000)*(fails+1)));
    };
    const wake=()=>{if(!document.hidden){clearTimeout(timer);run()}};
    run();document.addEventListener("visibilitychange",wake);
    return()=>{stop=true;clearTimeout(timer);document.removeEventListener("visibilitychange",wake)};
  },[number,prefs.saver,signOut]);

  /* send: the outbox retries in order until the server accepts each message */
  useEffect(()=>{
    if(!number||!online||!outbox.length||sending.current)return;
    sending.current=true;
    const m=outbox[0];
    api("/api/messages",{method:"POST",body:{id:m.id,to:m.to,text:m.text,ts:m.ts,file:m.file}})
      .then(()=>{setMsgs(old=>old.some(x=>x.id===m.id)?old:[...old,m].sort((a,b)=>a.ts-b.ts));setOutbox(o=>o.filter(x=>x.id!==m.id))})
      .catch(e=>{
        if(e.status===401)return signOut();
        if(e.status>=400&&e.status<500){setOutbox(o=>o.filter(x=>x.id!==m.id));notify(e.message)}  /* rejected for good: drop it */
      })
      .finally(()=>{sending.current=false});
  },[outbox,online,number,polls,signOut,notify]);

  const sendMessage=(to,text,file)=>setOutbox(o=>[...o,{id:uid(),from:number,to,text,ts:Date.now(),file}]);

  /* contacts */
  const lookup=useCallback(async n=>{
    try{const u=await api("/api/users/"+n);setNames(x=>({...x,[n]:{name:u.name,about:u.about,avatar:u.avatar}}));return u}
    catch(e){return e.status===404?null:Promise.reject(e)}
  },[]);
  useEffect(()=>{
    if(!number)return;
    for(const m of msgs){
      const p=m.from===number?m.to:m.from;
      if(!asked.current.has(p)){asked.current.add(p);lookup(p).catch(()=>asked.current.delete(p))}
    }
  },[msgs,number,lookup]);

  const startChat=async n=>{
    if(n===number)return"That's your own number.";
    if(!online)return"You're offline. Connect once to look up a number.";
    try{
      const u=await lookup(n);
      if(!u)return"That number isn't on Kite yet. Ask them to register, then try again.";
      setPartner(n);return"";
    }catch(e){return e.message}
  };
  const messageFromFeed=(n,name)=>{setNames(x=>x[n]?x:{...x,[n]:{name}});setPartner(n)};
  const saveProfile=async(name,about)=>{
    try{const r=await api("/api/me",{method:"POST",body:{name,about}});store.set("kite:profile",JSON.stringify(r.profile));setMe(r.profile);setNames(x=>({...x,[r.profile.number]:{name:r.profile.name,about:r.profile.about}}));notify("Profile saved")}
    catch(e){notify(e.message)}
  };
  const saveAvatar=async file=>{
    const before=me;if(file&&/^image\//.test(file.type))setMe(m=>({...m,avatarUrl:URL.createObjectURL(file)}));
    try{notify("Uploading photo\u2026");const url=await uploadImage(file,512);const r=await api("/api/users/avatar",{method:"POST",body:{url}});store.set("kite:profile",JSON.stringify(r.profile));setMe(r.profile);notify("Profile photo updated")}
    catch(e){setMe(before);notify(e.message)}
  };
  const manualRefresh=()=>{setPolls(n=>n+1);notify(online?"Checking for messages…":"You're offline.")};

  /* derived */
  const nameOf=n=>n===number?me.name+" (you)":(names[n]&&names[n].name)||pretty(n);
  const avatarOf=n=>n===number?(me.avatarUrl||""):(names[n]&&names[n].avatar)||"";
  const all=useMemo(()=>[...msgs,...outbox.map(m=>({...m,pending:true}))].sort((a,b)=>a.ts-b.ts),[msgs,outbox]);
  const convos=useMemo(()=>{
    if(!number)return[];
    const map=new Map();
    for(const m of all){
      const p=m.from===number?m.to:m.from;
      const c=map.get(p)||{partner:p,last:m,unread:0};
      c.last=m;if(m.from!==number&&m.ts>(reads[p]||0))c.unread++;

  /* mark the open chat as read */
  useEffect(()=>{
    if(!partner)return;

    if(latest>(reads[partner]||0)){setReads(r=>({...r,[partner]:latest}));if(!document.hidden)api("/api/messages/read",{method:"POST",body:{with:partner}}).catch(()=>{})}
  },[partner,thread,reads]);

  const toggleTheme=()=>setPrefs(p=>({...p,theme:({light:"dim",dim:"dark",dark:"light"})[p.theme]||"light"}));
  const TABS=[["chats","Chats","chat"],["feed","Feed","feed"],["me","Me","user"]];

  let body;
  if(booting)body=h("div",{className:"boot"},h(Logo,{size:56}));
  else if(!me)body=h(Auth,{onDone:onAuthed,theme:prefs.theme,onTheme:toggleTheme});
  else if(partner)body=h(ChatView,{me,partner,name:nameOf(partner),about:names[partner]&&names[partner].about,list:thread,online,onBack:()=>setPartner(null),onSend:sendMessage,onRefresh:manualRefresh,onProfile:openProfile,avatar:avatarOf(partner),notify,prefs,rcpts,presence:pres});
  else body=h(Fragment,null,
    h("header",{className:"top"},
      h("div",{className:"brand"},h(Logo,{size:30}),"Kite"),h("div",{className:"spacer"}),
      !online&&h("span",{className:"pill"},h(Icon,{n:"off",s:15}),"Offline"),
      h("button",{className:"iconbtn",onClick:toggleTheme,"aria-label":prefs.theme==="dark"?"Switch to light theme":"Switch to dark theme"},h(Icon,{n:prefs.theme==="dark"?"sun":"moon"}))),
    h("main",{className:"main"},
      tab==="chats"&&h(ChatList,{me,convos,nameOf,onOpen:setPartner,onStart:startChat,notify,onProfile:openProfile,avatarOf}),
      tab==="feed"&&h(FeedTab,{me,convos,nameOf,avatarOf,notify,onMessage:messageFromFeed,onProfile:openProfile,forward:setFwd}),
      tab==="me"&&h(Me,{me,prefs,setPrefs,onSave:saveProfile,onSignOut:signOut,onAvatar:saveAvatar,notify})),
    !online&&h("div",{className:"banner"},"You're offline. Showing saved chats."),
    h("nav",{className:"tabs","aria-label":"Main"},
      TABS.map(([id,label,icon])=>h("button",{key:id,className:"tab","aria-current":tab===id?"page":undefined,onClick:()=>setTab(id)},
        h(Icon,{n:icon,s:22}),label,id==="chats"&&unread>0&&h("span",{className:"count"},unread)))));

  return h("div",{className:"shell","data-skin":me?prefs.theme:undefined},body,
    card&&h(ProfileCard,{card,me,notify,onClose:()=>setCard(null),onMessage:(n,nm)=>{setCard(null);messageFromFeed(n,nm)}}),
    fwd&&h(ForwardSheet,{convos,nameOf,onClose:()=>setFwd(null),onSend:to=>{sendMessage(to,fwd);setFwd(null);notify("Forwarded")}}),
    toast&&h("div",{className:"toast",role:"status"},toast));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(React.StrictMode,null,h(App)));
}
