.kite,.kite *{box-sizing:border-box}
.kite{--bg:#ffffff;--sky:#f1f6ff;--tint:#e2edff;--line:#d9e5fa;--ink:#0b1b3a;--mute:#566789;--accent:#1668e3;--btn:#1668e3;--btn-ink:#ffffff;--mine:#1668e3;--mine-ink:#ffffff;--theirs:#ffffff;--theirs-ink:#0b1b3a;--bad:#c22f2f;
position:fixed;inset:0;display:flex;justify-content:center;background:var(--sky);color:var(--ink);
font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.kite[data-theme=dark]{--bg:#0a1730;--sky:#0d1f45;--tint:#16305f;--line:#1e3a72;--ink:#eaf1ff;--mute:#94aad6;--accent:#7fb2ff;--btn:#2f6fe4;--mine:#2f6fe4;--theirs:#14295a;--theirs-ink:#eaf1ff;--bad:#ff9090}
:where(.kite) button{font-family:inherit;color:inherit;cursor:pointer}
:where(.kite) input,:where(.kite) textarea{font-family:inherit}
.kite :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;height:100%;overflow:hidden;background:var(--bg)}
@media(min-width:520px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.boot{flex:1;display:grid;place-items:center;color:var(--accent)}

.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.logo{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--btn);color:#fff}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:99px;background:var(--tint);color:var(--accent);font-size:13px;font-weight:700}
.iconbtn{display:grid;place-items:center;flex:none;width:38px;height:38px;border:0;border-radius:12px;background:var(--sky)}

.main{flex:1;overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain}
.h1{margin:6px 0 14px;font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.h2{margin:26px 0 10px;font-size:17px;font-weight:700}
.titlerow{display:flex;align-items:center;justify-content:space-between}
.lbl{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:var(--mute)}
.lbl.first{margin-top:0}
.field{display:block;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:none}
.field.code{font-size:24px;font-weight:700;letter-spacing:.5em;text-align:center}
.inline{display:flex;gap:8px}
.inline .field{flex:1;min-width:0;width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px 18px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:700;white-space:nowrap}
.btn.sm{width:auto;margin-top:0;padding:11px 16px}
.btn.soft{margin-top:22px;background:var(--tint);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.err{margin-top:10px;font-size:14px;font-weight:600;color:var(--bad)}
.fine{margin:18px 0 0;font-size:13px;color:var(--mute)}
.empty{margin:22px 4px;font-size:15px;color:var(--mute)}
.note{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--mute)}
.card{margin-bottom:6px;padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--sky)}

.list{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;border:0;border-radius:16px;background:none;text-align:left}
.row:hover,.row:active{background:var(--sky)}
.avatar{display:grid;place-items:center;flex:none;border-radius:50%;font-weight:800;background:hsl(var(--h) 85% 92%);color:hsl(var(--h) 70% 30%)}
.kite[data-theme=dark] .avatar{background:hsl(var(--h) 60% 26%);color:hsl(var(--h) 100% 90%)}
.rowmain{flex:1;min-width:0}
.rowtitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:700}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:14px;color:var(--mute)}
.time{flex:none;font-size:12px;font-weight:500;color:var(--mute)}
.count{display:grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:#fff;font-size:12px;font-weight:700}

.tabs{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.tab{position:relative;display:flex;flex:1;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:0;border-radius:16px;background:none;color:var(--mute);font-size:12px;font-weight:700}
.tab[aria-current=true]{background:var(--tint);color:var(--accent)}
.tab .count{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px}

.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.msgs{display:flex;flex:1;flex-direction:column;gap:5px;overflow-y:auto;padding:12px 14px;background:var(--sky);overscroll-behavior:contain}
.day{align-self:center;margin:10px 0 4px;padding:3px 10px;border-radius:99px;background:var(--tint);font-size:12px;font-weight:600;color:var(--mute)}
.bub{max-width:82%;padding:9px 13px 7px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .18s ease-out}
.bub.me{align-self:flex-end;border-bottom-right-radius:6px;background:var(--mine);color:var(--mine-ink)}
.bub.them{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:6px;background:var(--theirs);color:var(--theirs-ink)}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;font-size:11px;opacity:.75;white-space:normal}
.offbar{padding:8px 14px;background:var(--tint);font-size:13px;font-weight:600;text-align:center;color:var(--accent)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;min-height:44px;max-height:120px;padding:10px 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--sky);color:var(--ink);font-size:16px;line-height:1.3;resize:none;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.send{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--btn);color:#fff}
.send:disabled{opacity:.4;cursor:default}

.post{padding:14px 4px 12px;border-bottom:1px solid var(--line)}
.posthead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.posttext{font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:0;border-radius:99px;background:var(--sky);color:var(--mute);font-size:13px;font-weight:700}
.act[aria-pressed=true]{background:var(--tint);color:var(--accent)}
.composerow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.chars{font-size:13px;color:var(--mute)}

.profile{display:flex;align-items:center;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--sky)}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border:0;border-radius:12px;background:none;color:var(--mute);font-size:14px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--btn);color:#fff}
.setrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.setname{font-weight:700}
.switch{position:relative;flex:none;width:50px;height:30px;border:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked=true]{background:var(--btn)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.meter{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-weight:600}
.meter strong{margin-left:auto}

.auth{position:relative;isolation:isolate;flex:1;overflow-y:auto;padding:0 22px 28px}
.lattice{position:absolute;z-index:-1;top:0;left:0;right:0;height:360px;pointer-events:none;
background:repeating-linear-gradient(45deg,transparent 0 34px,var(--tint) 34px 35px),repeating-linear-gradient(-45deg,transparent 0 34px,var(--tint) 34px 35px);
-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.authtop{position:relative;display:flex;justify-content:flex-end;padding-top:max(12px,env(safe-area-inset-top))}
.hero{position:relative;padding:14px 0 24px}
.hero .logo{width:64px;height:64px;border-radius:20px}
.hero h1{margin:18px 0 6px;font-size:42px;font-weight:800;letter-spacing:-.04em;line-heig
ht:1}
.hero p{max-width:26ch;margin:0;font-size:18px;font-weight:500;line-height:1.3;color:var(--mute)}

.toast{position:absolute;left:50%;bottom:92px;z-index:9;max-width:88%;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;transform:translateX(-50%);animation:fade .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
