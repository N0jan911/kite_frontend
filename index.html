document.documentElement.dataset.theme="light";

<style>
:root{--bg:#fff;--sky:#f1f6ff;--tint:#e2edff;--line:#d9e5fa;--ink:#0b1b3a;--mute:#566789;--accent:#1668e3;--btn:#1668e3;--bad:#c22f2f;--theirs:#fff}

*{box-sizing:border-box}
html,body,#root{margin:0;height:100%}
body{background:var(--sky);color:var(--ink);font:16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:520px){.shell{border:0 solid var(--line);border-width:0 1px}}
.logo-dark{display:none}
:root[data-theme=dark] .logo-light{display:none}
:root[data-theme=dark] .logo-dark{display:block}
.logo-light{display:block}
.boot{flex:1;display:grid;place-items:center}
.top{display:flex;align-items:center;gap:8px;padding:max(12px,env(safe-area-inset-top)) 16px 8px}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.spacer{flex:1}
.pill,.iconbtn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--tint);color:var(--accent)}
.pill{gap:6px;height:34px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:700}
.iconbtn{flex:none;width:38px;height:38px;border-radius:12px;background:var(--sky);color:var(--ink)}
.main{flex:1;overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain}
.h1{margin:6px 0 14px;font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.h2{margin:26px 0 10px;font-size:17px;font-weight:700}
.titlerow{display:flex;align-items:center;justify-content:space-between}
.sub{margin:0;font-size:14px;color:var(--mute)}
.lbl{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:var(--mute)}
.field{display:block;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:none}
.field.code{font-size:24px;font-weight:700;letter-spacing:.5em;text-align:center}
.inline{display:flex;gap:8px}
.inline .field{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px 18px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-weight:700}
.btn.sm{width:auto;margin:0;padding:11px 16px}
.btn.soft{background:var(--tint);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.err{margin-top:10px;font-size:14px;font-weight:600;color:var(--bad)}
.empty{margin:22px 4px;color:var(--mute)}
.card{margin-bottom:6px;padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--sky)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;border:0;border-radius:16px;background:none;text-align:left}
.row:hover{background:var(--sky)}
.avatar{display:grid;place-items:center;flex:none;border-radius:50%;font-weight:800;background:hsl(var(--h) 85% 92%);color:hsl(var(--h) 70% 30%)}
:root[data-theme=dark] .avatar{background:hsl(var(--h) 60% 26%);color:hsl(var(--h) 100% 90%)}
.grow{flex:1;min-width:0}
.line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name{font-weight:700}
.trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{flex:none;font-size:12px;color:var(--mute)}
.count{display:grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:#fff;font-size:12px;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px 10px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.tab{position:relative;display:flex;flex:1;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:0;border-radius:16px;background:none;color:var(--mute);font-size:12px;font-weight:700}
.tab[aria-current=page]{background:var(--tint);color:var(--accent)}
.tab .count{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px}
.chathead{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.msgs{display:flex;flex:1;flex-direction:column;gap:5px;overflow-y:auto;padding:12px 14px;background:var(--sky);overscroll-behavior:contain}
.day{align-self:center;margin:10px 0 4px;padding:3px 10px;border-radius:99px;background:var(--tint);font-size:12px;font-weight:600;color:var(--mute)}
.bub{max-width:82%;padding:9px 13px 7px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;border-bottom-right-radius:6px;background:var(--btn);color:#fff}
.bub.them{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:6px;background:var(--theirs)}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;font-size:11px;opacity:.75}
.banner{padding:8px 14px;background:var(--tint);font-size:13px;font-weight:600;text-align:center;color:var(--accent)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;min-height:44px;max-height:120px;padding:10px 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--sky);line-height:1.3;resize:none;outline:none}
.send{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--btn);color:#fff}
.send:disabled{opacity:.4;cursor:default}
.post{padding:14px 4px 12px;border-bottom:1px solid var(--line)}
.posthead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:0;border-radius:99px;background:var(--sky);color:var(--mute);font-size:13px;font-weight:700}
.act[aria-pressed=true]{background:var(--tint);color:var(--accent)}
.composerow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--sky)}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border:0;border-radius:12px;background:none;color:var(--mute);font-size:14px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--btn);color:#fff}
.setrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.switch{position:relative;flex:none;width:50px;height:30px;border:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--btn)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.auth{flex:1;overflow-y:auto;padding:0 22px 28px}
.hero{padding:14px 0 24px}
.hero h1{margin:18px 0 6px;font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero p{margin:0;font-size:18px;color:var(--mute)}
.links{display:flex;gap:8px;margin-top:14px}
.toast{position:absolute;left:50%;bottom:92px;z-index:9;max-width:88%;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shell[data-skin=dark]{--bg:#000;--sky:#0b0b0b;--tint:#1c1c1c;--line:#2a2a2a;--ink:#fff;--mute:#9a9a9a;--accent:#fff;--btn:#fff;--bad:#ff8a8a;--theirs:#161616}
.shell[data-skin=dark] .btn,.shell[data-skin=dark] .send,.shell[data-skin=dark] .count,.shell[data-skin=dark] .bub.me,.shell[data-skin=dark] .seg button[aria-pressed=true],.shell[data-skin=dark] .fab{color:#000}
.shell[data-skin=dark] .btn.soft{color:#fff}
.shell[data-skin=dark] .avatar{background:#222;color:#fff}
.shell[data-skin=dark] .logo-light{display:none}
.shell[data-skin=dark] .logo-dark{display:block}
.shell[data-skin=dark] .switch[aria-checked=true]::after{background:#000}
.fab{position:absolute;right:18px;bottom:88px;z-index:5;display:grid;place-items:center;width:56px;height:56px;border:0;border-radius:50%;background:var(--btn);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.scrim{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.4)}
.fabmenu{position:absolute;right:18px;bottom:156px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fabopt{padding:11px 18px;border:0;border-radius:99px;background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:72%;overflow-y:auto;padding:16px 16px max(18px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--bg);box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.pic{display:block;width:100%;max-height:360px;margin-top:10px;border-radius:16px;object-fit:cover}
.cam{position:absolute;right:-2px;bottom:-2px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;border:2px solid var(--bg)}
.shell[data-skin=dark] .cam{color:#000}
</style>

<div id="root"></div>
<noscript>Kite needs JavaScript to run.</noscript>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

if(!window.React||!window.ReactDOM){
  document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>');

<script>
if(!window.React||!window.ReactDOM){
  document.getElementById("root").innerHTML='<div style="font-family:system-ui;padding:32px;text-align:center"><h2>Kite could not load</h2><p>Check your connection and reload this page.</p></div>';
}else{
const {useState,useEffect,useRef,useCallback,useMemo,Fragment,createElement:h}=React;

/* ---------- config & helpers ---------- */
const API="https://kite-backend-pqsm.onrender.com";
const TOKEN_KEY="kite_token", OTP_MS=10*60*1000, RESEND_MS=30*1000, KEEP_MSGS=500;

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  json(k,d){try{const v=JSON.parse(store.get(k));return v==null?d:v}catch(e){return d}}
};
const digits=s=>(s||"").replace(/\D/g,"");
const validNum=n=>n.length>=8&&n.length<=15;
const pretty=n=>"+"+n;
const uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2,8);
const hue=s=>{let n=7;for(const c of String(s))n=(n*31+c.charCodeAt(0))>>>0;return 198+n%52};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const clock=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayName=t=>sameDay(t,Date.now())?"Today":sameDay(t,Date.now()-864e5)?"Yesterday":new Date(t).toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"});
const shortWhen=t=>sameDay(t,Date.now())?clock(t):Date.now()-t<6*864e5?new Date(t).toLocaleDateString([],{weekday:"short"}):new Date(t).toLocaleDateString([],{day:"numeric",month:"short"});
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1e3);return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":new Date(t).toLocaleDateString([],{day:"numeric",month:"short"})};

/* Every backend call goes through here. Errors carry .status (0 = network/timeout). */
async function api(path,{method="GET",body,auth=true}={}){
  const headers={"Content-Type":"application/json"};
  const token=store.get(TOKEN_KEY);
  if(auth&&token)headers.Authorization="Bearer "+token;
  let res;
  try{
    res=await fetch(API+path,{method,headers,body:body&&JSON.stringify(body),
      signal:window.AbortSignal&&AbortSignal.timeout?AbortSignal.timeout(25000):undefined});
  }catch(e){
    const err=new Error("Can't reach the server. Check your connection and try again.");
    err.status=0;throw err;
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const err=new Error(data.error||"Something went wrong. Try again.");err.status=res.status;throw err}
  return data;
}

const CLOUD="fic8wg7w",PRESET="kite_uploads",MAX_PIC=5*1024*1024;
async function uploadImage(file){
  if(!file||!/^image\//.test(file.type))throw new Error("Choose an image file.");
  if(file.size>MAX_PIC)throw new Error("Photo must be under 5 MB.");
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",PRESET);
  let res;
  try{res=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd})}
  catch(e){throw new Error("Couldn't upload the photo. Check your connection.")}
  const d=await res.json().catch(()=>({}));
  if(!res.ok||!d.secure_url)throw new Error("Photo upload failed. Try again.");
  return d.secure_url;
}

/* ---------- UI atoms ---------- */
const PATHS={
  back:"M19 12H5M12 19l-7-7 7-7",plus:"M12 5v14M5 12h14",close:"M18 6L6 18M6 6l12 12",camera:"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",image:"M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21",chev:"M9 18l6-6-6-6",send:"M22 2 11 13M22 2l-7 20-4-9-9-4z",
  chat:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  feed:"M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16M5 19h.01",
  status:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v8M8 12h8",
  user:"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  moon:"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z",
  sun:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4",
  refresh:"M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15",
  check:"M20 6 9 17l-5-5",clock:"M12 6v6l4 2M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z",
  heart:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z",
  logout:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  eye:"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  trash:"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
  off:"M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M12 20h.01"
};
const Icon=({n,s=20,fill})=>h("svg",{width:s,height:s,viewBox:"0 0 24 24",fill:fill?"currentColor":"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round","aria-hidden":true},h("path",{d:PATHS[n]}));
const Logo=({size=30})=>h(Fragment,null,
  h("img",{className:"logo-light",src:"logo-light.png",alt:"Kite",width:size,height:size}),
  h("img",{className:"logo-dark",src:"logo-dark.png",alt:"Kite",width:size,height:size}));
const Avatar=({id,name,size=46,onClick,src})=>h("div",{className:"avatar",onClick:onClick&&(e=>{e.stopPropagation();onClick()}),style:{"--h":hue(id),width:size,height:size,fontSize:Math.round(size*.4),overflow:"hidden",cursor:onClick?"pointer":undefined}},src?h("img",{src,alt:"",style:{width:"100%",height:"100%",objectFit:"cover"}}):((name||"?").trim().charAt(0)||"?").toUpperCase());
const Err=({text})=>text?h("div",{className:"err",role:"alert"},text):null;

/* ---------- Sheets: profile card, forward, status menu ---------- */
function Sheet({title,onClose,children}){
  return h(Fragment,null,h("div",{className:"scrim",style:{zIndex:6},onClick:onClose}),
    h("div",{className:"sheet",role:"dialog","aria-label":title},
      h("div",{className:"titlerow",style:{marginBottom:8}},h("div",{className:"name"},title),h("button",{className:"iconbtn",onClick:onClose,"aria-label":"Close"},h(Icon,{n:"close"}))),
      children));
}
function ProfileCard({card,me,onClose,onMessage}){
  const mine=card.number===me.number;
  return h(Sheet,{title:"Profile",onClose},
    h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"8px 0 14px"}},
      h(Avatar,{id:card.number,name:card.name,size:96,src:mine?me.avatarUrl:card.avatar}),
      h("div",{className:"h2",style:{margin:"6px 0 0"}},mine?me.name:card.name),
      h("div",{className:"sub"},pretty(card.number))),
    !mine&&h("button",{className:"btn",onClick:()=>onMessage(card.number,card.name)},"Message"));
}
function ForwardSheet({convos,nameOf,onClose,onSend}){
  return h(Sheet,{title:"Forward to",onClose},
    convos.length===0&&h("p",{className:"empty"},"No chats yet. Start a chat first, then forward."),
    convos.map(c=>h("button",{key:c.partner,className:"row",onClick:()=>onSend(c.partner)},h(Avatar,{id:c.partner,name:nameOf(c.partner)}),h("div",{className:"grow name trunc"},nameOf(c.partner)))));
}
function StatusMenu({x,onClose,onForward,onDelete}){
  return h(Sheet,{title:"Status",onClose},
    h("button",{className:"row",onClick:()=>{onClose();onForward((x.mine?"My status":x.name+"'s status")+": "+x.text)}},h("div",{className:"grow name"},"Forward")),
    x.mine&&h("button",{className:"row",onClick:()=>{onClose();onDelete(x)}},h("div",{className:"grow name",style:{color:"var(--bad)"}},"Delete")));
}

function PhotoPick({photo,setPhoto}){
  const [url,setUrl]=useState("");
  useEffect(()=>{if(!photo){setUrl("");return}const u=URL.createObjectURL(photo);setUrl(u);return()=>URL.revokeObjectURL(u)},[photo]);
  return h(Fragment,null,
    url&&h("img",{className:"pic",src:url,alt:"Selected photo"}),
    h("div",{style:{display:"flex",gap:8,marginTop:8}},
      h("label",{className:"act"},h(Icon,{n:"image",s:16}),photo?"Change photo":"Add photo",h("input",{type:"file",accept:"image/*",style:{display:"none"},onChange:e=>{const f=e.target.files[0];e.target.value="";if(f)setPhoto(f)}})),
      photo&&h("button",{className:"act",onClick:()=>setPhoto(null)},"Remove")));
}

/* ---------- Auth ---------- */
function Auth({onDone,theme,onTheme}){
  const [mode,setMode]=useState("register"),[phone,setPhone]=useState(""),[name,setName]=useState("");
  const [step,setStep]=useState("form"),[pin,setPin]=useState(""),[pinId,setPinId]=useState(null);
  const [busy,setBusy]=useState(false),[err,setErr]=useState("");
  const [expiresAt,setExpiresAt]=useState(0),[resendAt,setResendAt]=useState(0),[now,setNow]=useState(Date.now());
  const num=digits(phone);
  const canSend=validNum(num)&&(mode==="signin"||name.trim().length>=2);

  useEffect(()=>{
    if(step!=="code")return;
    const t=setInterval(()=>setNow(Date.now()),1000);
    return()=>clearInterval(t);
  },[step]);

  const expired=step==="code"&&now>expiresAt;
  const secs=Math.max(0,Math.ceil((expiresAt-now)/1000));
  const wait=Math.max(0,Math.ceil((resendAt-now)/1000));

  const sendCode=async()=>{
    setBusy(true);setErr("");
    try{

  useEffect(()=>{
    if(!number)return;
    let stop=false,timer=0,fails=0;
    const pull=async()=>{
      const r=await api("/api/messages?after="+encodeURIComponent(cursor.current));
      const fresh=(r.messages||[]).filter(m=>m&&m.id&&m.from&&m.to&&typeof m.text==="string");
      if(r.cursor){cursor.current=r.cursor;store.set("kite:cursor:"+number,r.cursor)}
      if(fresh.length)setMsgs(old=>{const map=new Map(old.map(m=>[m.id,m]));fresh.forEach(m=>map.set(m.id,m));return[...map.values()].sort((a,b)=>a.ts-b.ts)});
    };
    const run=async()=>{
      if(stop)return;
      if(!document.hidden&&navigator.onLine!==false){
        try{await pull();fails=0;setPolls(n=>n+1)}
        catch(e){if(e.status===401)return signOut();fails++}
      }
      timer=setTimeout(run,Math.min(60000,(prefs.saver?20000:6000)*(fails+1)));
    };
    const wake=()=>{if(!document.hidden){clearTimeout(timer);run()}};
    run();document.addEventListener("visibilitychange",wake);
    return()=>{stop=true;clearTimeout(timer);document.removeEventListener("visibilitychange",wake)};
  },[number,prefs.saver,signOut]);

  /* send: the outbox retries in order until the server accepts each message */
  useEffect(()=>{
    if(!number||!online||!outbox.length||sending.current)return;
    sending.current=true;
    const m=outbox[0];
    api("/api/messages",{method:"POST",body:{id:m.id,to:m.to,text:m.text,ts:m.ts}})
      .then(()=>{setMsgs(old=>old.some(x=>x.id===m.id)?old:[...old,m].sort((a,b)=>a.ts-b.ts));setOutbox(o=>o.filter(x=>x.id!==m.id))})
      .catch(e=>{
        if(e.status===401)return signOut();
        if(e.status>=400&&e.status<500){setOutbox(o=>o.filter(x=>x.id!==m.id));notify(e.message)}  /* rejected for good: drop it */
      })
      .finally(()=>{sending.current=false});
  },[outbox,online,number,polls,signOut,notify]);

  const sendMessage=(to,text)=>setOutbox(o=>[...o,{id:uid(),from:number,to,text,ts:Date.now()}]);

  /* contacts */
  const lookup=useCallback(async n=>{
    try{const u=await api("/api/users/"+n);setNames(x=>({...x,[n]:{name:u.name,about:u.about,avatar:u.avatar}}));return u}
    catch(e){return e.status===404?null:Promise.reject(e)}
  },[]);
  useEffect(()=>{
    if(!number)return;
    for(const m of msgs){
      const p=m.from===number?m.to:m.from;
      if(!asked.current.has(p)){asked.current.add(p);lookup(p).catch(()=>asked.current.delete(p))}
    }
  },[msgs,number,lookup]);

  const startChat=async n=>{
    if(n===number)return"That's your own number.";
    if(!online)return"You're offline. Connect once to look up a number.";
    try{
      const u=await lookup(n);
      if(!u)return"That number isn't on Kite yet. Ask them to register, then try again.";
      setPartner(n);return"";
    }catch(e){return e.message}
  };
  const messageFromFeed=(n,name)=>{setNames(x=>x[n]?x:{...x,[n]:{name}});setPartner(n)};
  const saveProfile=async(name,about)=>{
    try{const r=await api("/api/me",{method:"POST",body:{name,about}});store.set("kite:profile",JSON.stringify(r.profile));setMe(r.profile);setNames(x=>({...x,[r.profile.number]:{name:r.profile.name,about:r.profile.about}}));notify("Profile saved")}
    catch(e){notify(e.message)}
  };
  const saveAvatar=async file=>{
    try{notify("Uploading photo\u2026");const url=await uploadImage(file);const r=await api("/api/users/avatar",{method:"POST",body:{url}});store.set("kite:profile",JSON.stringify(r.profile));setMe(r.profile);notify("Profile photo updated")}
    catch(e){notify(e.message)}
  };
  const manualRefresh=()=>{setPolls(n=>n+1);notify(online?"Checking for messages…":"You're offline.")};

  /* derived */
  const nameOf=n=>n===number?me.name+" (you)":(names[n]&&names[n].name)||pretty(n);
  const avatarOf=n=>n===number?(me.avatarUrl||""):(names[n]&&names[n].avatar)||"";
  const all=useMemo(()=>[...msgs,...outbox.map(m=>({...m,pending:true}))].sort((a,b)=>a.ts-b.ts),[msgs,outbox]);
  const convos=useMemo(()=>{
    if(!number)return[];
    const map=new Map();
    for(const m of all){
      const p=m.from===number?m.to:m.from;
      const c=map.get(p)||{partner:p,last:m,unread:0};
      c.last=m;if(m.from!==number&&m.ts>(reads[p]||0))c.unread++;
      map.set(p,c);
    }
    return[...map.values()].sort((a,b)=>b.last.ts-a.last.ts);
  },[all,reads,number]);
  const unread=convos.reduce((s,c)=>s+c.unread,0);
  const thread=useMemo(()=>partner?all.filter(m=>(m.from===partner&&m.to===number)||(m.from===number&&m.to===partner)):[],[all,partner,number]);

  /* mark the open chat as read */
  useEffect(()=>{
    if(!partner)return;
    const latest=thread.reduce((t,m)=>m.from===partner&&m.ts>t?m.ts:t,0);
    if(latest>(reads[partner]||0))setReads(r=>({...r,[partner]:latest}));
  },[partner,thread,reads]);

  const toggleTheme=()=>setPrefs(p=>({...p,theme:p.theme==="dark"?"light":"dark"}));
  const TABS=[["chats","Chats","chat"],["feed","Feed","feed"],["status","Status","status"],["me","Me","user"]];

  let body;
  if(booting)body=h("div",{className:"boot"},h(Logo,{size:56}));
  else if(!me)body=h(Auth,{onDone:onAuthed,theme:prefs.theme,onTheme:toggleTheme});
  else if(partner)body=h(ChatView,{me,partner,name:nameOf(partner),about:names[partner]&&names[partner].about,list:thread,online,onBack:()=>setPartner(null),onSend:sendMessage,onRefresh:manualRefresh,onProfile:openProfile,avatar:avatarOf(partner)});
  else body=h(Fragment,null,
    h("header",{className:"top"},
      h("div",{className:"brand"},h(Logo,{size:30}),"Kite"),h("div",{className:"spacer"}),
      !online&&h("span",{className:"pill"},h(Icon,{n:"off",s:15}),"Offline"),
      h("button",{className:"iconbtn",onClick:toggleTheme,"aria-label":prefs.theme==="dark"?"Switch to light theme":"Switch to dark theme"},h(Icon,{n:prefs.theme==="dark"?"sun":"moon"}))),
    h("main",{className:"main"},
      tab==="chats"&&h(ChatList,{me,convos,nameOf,onOpen:setPartner,onStart:startChat,notify,onProfile:openProfile,avatarOf}),
      tab==="feed"&&h(Feed,{me,onMessage:messageFromFeed,notify,onProfile:openProfile}),
      tab==="status"&&h(Status,{me,notify,onProfile:openProfile,forward:setFwd}),
      tab==="me"&&h(Me,{me,prefs,setPrefs,onSave:saveProfile,onSignOut:signOut,onAvatar:saveAvatar})),
    !online&&h("div",{className:"banner"},"You're offline. Showing saved chats."),
    h("nav",{className:"tabs","aria-label":"Main"},
      TABS.map(([id,label,icon])=>h("button",{key:id,className:"tab","aria-current":tab===id?"page":undefined,onClick:()=>setTab(id)},
        h(Icon,{n:icon,s:22}),label,id==="chats"&&unread>0&&h("span",{className:"count"},unread)))));

  return h("div",{className:"shell","data-skin":me?prefs.theme:undefined},body,
    card&&h(ProfileCard,{card,me,onClose:()=>setCard(null),onMessage:(n,nm)=>{setCard(null);messageFromFeed(n,nm)}}),
    fwd&&h(ForwardSheet,{convos,nameOf,onClose:()=>setFwd(null),onSend:to=>{sendMessage(to,fwd);setFwd(null);notify("Forwarded")}}),
    toast&&h("div",{className:"toast",role:"status"},toast));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(React.StrictMode,null,h(App)));
}
</script>
</body>
</html>
